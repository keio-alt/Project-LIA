<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>School Bullying Reporting System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0; 
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      display: flex;
      width: 1200px; 
      height: 700px;  
      border: 1px solid #ccc;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
      transition: all 0.6s ease;
      background: #fff;
    }

    .form-box, .image-box {
      flex: 1;
      padding: 30px;
    }

    .form-box {
      background: #eaeaea; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .form-box h2 {
      margin-bottom: 20px;
      color: #333;
      text-align: center;
    }

    .form-box form {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .form-box input {
      width: 80%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #aaa;
      border-radius: 5px;
      text-align: left;
    }

    .form-box button {
      width: 85%;
      padding: 10px;
      background: #999;
      border: none;
      border-radius: 5px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
    }

    .form-box button:hover {
      background: #777;
    }

    .links {
      margin-top: 15px;
      text-align: center;
    }

    .links a {
      text-decoration: none;
      color: #555;
      margin: 0 10px;
      cursor: pointer;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .image-box {
      background: #dcdcdc; 
      position: relative; 
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
      font-size: 18px;
      font-weight: bold;
    }

    .logo {
      position: absolute;
      top: 20px;
      width: 80px;
      height: 80px;
      background: #bbb;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      color: #fff;
    }

    .logo1 {
      left: 20px;
    }

    .logo2 {
      left: 120px; 
    }

    .switched {
      flex-direction: row-reverse;
      transform: translateX(20px); 
    }
  </style>
</head>
<body>
  <div class="container" id="container">
    <!-- Form Section -->
    <div class="form-box">
      <h2 id="form-title">Login</h2>
      <form id="form">
        <input type="text" placeholder="Username" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Log In</button>
      </form>
      <div class="links">
        <a onclick="switchForm('register')">Register</a>
        <a onclick="switchForm('login')">Login</a>
      </div>
    </div>

    <!-- Image Section -->
    <div class="image-box">
      <div class="logo logo1">Logo 1</div>
      <div class="logo logo2">Logo 2</div>
      <p>BULLYING MAGINIR</p>
    </div>
  </div>

  <script>
    function switchForm(type) {
      const container = document.getElementById('container');
      const formTitle = document.getElementById('form-title');
      const form = document.getElementById('form');

      if (type === 'register') {
        container.classList.add('switched');
        formTitle.textContent = "Register";
        form.innerHTML = `
          <input type="text" placeholder="Full Name" required>
          <input type="text" placeholder="Username" required>
          <input type="text" placeholder="LRN" required>
          <input type="password" placeholder="Password" required>
          <input type="password" placeholder="Re-enter Password" required>
          <button type="submit">Register</button>
        `;
      } else {
        container.classList.remove('switched');
        formTitle.textContent = "Login";
        form.innerHTML = `
          <input type="text" placeholder="Username" required>
          <input type="password" placeholder="Password" required>
          <button type="submit">Log In</button>
        `;
      }
    }
  </script>
</body>
</html>
